<div class="login">
  <div class="card login__card">
    <div class="login__brand">💪 Workout Tracker</div>
    <p class="login__subtitle">Sign in to continue</p>

    <button class="btn btn--primary login__submit" [disabled]="signingIn()" (click)="signIn()">
      @if (signingIn()) {
        Signing in…
      } @else {
        Sign in with Google
      }
    </button>

    @if (auth.error()) {
      <p class="login__error">{{ auth.error() }}</p>
    }
  </div>
</div>
